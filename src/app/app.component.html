<!-- Header containing Navigation Tabs, Title, and Language Dropdown -->
<header class="c p-d-flex p-ai-center p-p-2">
  <div class="nav-lang-container p-d-flex p-ai-center p-jc-between" style="flex: 1;">
    
    <!-- Navigation Tabs -->
    <p-tabMenu [model]="navItems"></p-tabMenu>

    <!-- Title Centered -->
    <div class="title-container-inline">
      <h1 class="app-title">Almighty God Believers Church (Thanjavur) - Bible Seeker</h1>
    </div>

    <!-- Language Dropdown -->
    <div class="language-dropdown-container p-d-flex p-ai-center">
      <label class="dropdown-label p-mr-2" style="font-weight: bold;">Language:</label>
      <p-dropdown
        [options]="languages"
        [(ngModel)]="selectedLanguage"
        (onChange)="onLanguageChange()"
        optionLabel="label"
        styleClass="small-dropdown"
      ></p-dropdown>
    </div>
    
  </div>
</header>

<!-- Verse Search Form -->
<div class="verse-form p-d-flex p-ai-center p-jc-start p-p-2">
  <!-- <p-dropdown
    [options]="bookOptions"
    [(ngModel)]="bookName"
    placeholder="Select or Enter Book Name"
    optionLabel="label"
    [editable]="true"
    (onChange)="onBookNameChange($event)">
  </p-dropdown> -->

  <p-dropdown 
  [options]="bookOptions"
  [(ngModel)]="bookName"
  placeholder="Select or Enter Book Name"
  optionLabel="label"
  [filter]="true"
  filterBy="label,searchText"
  [editable]="true"
  (onChange)="onBookNameChange($event)">
</p-dropdown>


  <p-inputNumber
    #chapterInput
    [min]="1"
    placeholder="Chapter"
    [pAutoFocus]="true"
    [(ngModel)]="chapterNumber"
    (keydown.enter)="submitVerse()"
    (onFocus)="selectAllText(chapterInput)"
    inputStyleClass="small-input">
  </p-inputNumber>

  <p-inputNumber
    #verseInput
    placeholder="Verse"
    [min]="1"
    [(ngModel)]="verseNumber"
    (keydown.enter)="submitVerse()"
    (onFocus)="selectAllText(verseInput)"
    inputStyleClass="small-input">
  </p-inputNumber>

  <button pButton label="Submit" class="small-button" (click)="submitVerse()"></button>
</div>

<!-- PrimeNG Splitter with three panels: Old Testament, New Testament, History -->
<p-splitter [panelSizes]="[40, 40, 20]" [ngStyle]="{'height': '1000px', 'margin': '1rem 0'}">
  <!-- Old Testament Panel -->
  <ng-template pTemplate="panel">
    <div [ngStyle]="{'display': 'flex', 'flex-direction': 'column', 'height': '100%', 'width': '100%'}">
      <h3 style="margin: 3px;">Old Testament</h3>
      <div [ngStyle]="{'flex': '1', 'display': 'flex', 'flex-direction': 'row', 'overflow-x': 'auto'}">
        <p-listbox 
          [options]="oldTestamentBookOptions1"
          [ngStyle]="{'flex': '1'}"
          optionLabel="label" 
          class="custom-listbox"
          (onChange)="onListboxSelect($event)">
        </p-listbox>
        <p-listbox 
          [options]="oldTestamentBookOptions2"
          [ngStyle]="{'flex': '1'}"
          optionLabel="label" 
          class="custom-listbox"
          (onChange)="onListboxSelect($event)">
        </p-listbox>
        <p-listbox 
          [options]="oldTestamentBookOptions3"
          [ngStyle]="{'flex': '1'}"
          optionLabel="label" 
          class="custom-listbox"
          (onChange)="onListboxSelect($event)">
        </p-listbox>
      </div>
    </div>
  </ng-template>

  <!-- New Testament Panel -->
  <ng-template pTemplate="panel">
    <div [ngStyle]="{'display': 'flex', 'flex-direction': 'column', 'height': '100%', 'width': '100%'}">
      <h3 style="margin: 3px;">New Testament</h3>
      <div [ngStyle]="{'flex': '1', 'display': 'flex', 'flex-direction': 'row', 'overflow-x': 'auto'}">
        <p-listbox 
          [options]="newTestamentBookOptions1"
          [ngStyle]="{'flex': '1'}"
          optionLabel="label" 
          class="custom-listbox"
          (onChange)="onListboxSelect($event)">
        </p-listbox>
        <p-listbox 
          [options]="newTestamentBookOptions2"
          [ngStyle]="{'flex': '1'}"
          optionLabel="label" 
          class="custom-listbox"
          (onChange)="onListboxSelect($event)">
        </p-listbox>
        <p-listbox 
          [options]="newTestamentBookOptions3"
          [ngStyle]="{'flex': '1'}"
          optionLabel="label" 
          class="custom-listbox"
          (onChange)="onListboxSelect($event)">
        </p-listbox>
      </div>
    </div>
  </ng-template>

  <!-- History Panel -->
  <ng-template pTemplate="panel">
    <div [ngStyle]="{'display': 'flex', 'flex-direction': 'column', 'height': '100%', 'width': '100%'}">
      <h3 style="margin: 3px;">History</h3>
      <div [ngStyle]="{'flex': '1', 'display': 'flex', 'flex-direction': 'row', 'overflow-x': 'auto'}">
        <p-listbox
          [options]="historyOptions"
          [ngStyle]="{'flex': '1'}"
          optionLabel="label"
          class="custom-listbox history-listbox"
          (onChange)="onHistorySelect($event)">
          <ng-template let-item pTemplate="item">
            <div class="history-item">
              <span>{{ item.label }}</span>
              <button
                pButton
                type="button"
                icon="pi pi-copy"
                class="p-button-text p-button-rounded p-button-sm"
                (click)="copyHistoryItem(item, $event)">
              </button>
            </div>
          </ng-template>
        </p-listbox>
      </div>
    </div>
  </ng-template>
</p-splitter>

<!-- Fullscreen container for verse display -->
<div *ngIf="fullscreenMode" class="fullscreen" #fullscreenContainer tabindex="0">
  <div class="verse-text" #verseText>{{ currentVerseText }}</div>
  <div class="verse-info">
    <span>{{ currentBook }} {{ currentChapter }} : {{ currentVerse }}</span>
    <p-toggleButton *ngIf="selectedLanguage['value']!='Telugu'"
      [(ngModel)]="isEnglish"
      onLabel="English"
      offLabel="Tamil"
      onIcon="pi pi-check"
      offIcon="pi pi-times"
      (onChange)="toggleLanguage()"
      class="language-toggle">
    </p-toggleButton>
  </div>
</div>
